name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Active GitHub Pages tout seul au premier déploiement : aucune case à cocher
          # à aller chercher dans les réglages du dépôt.
          enablement: true
      # Le journal de ce dépôt est une note de travail interne : il ne doit pas être
      # servi sur le site public de Mélissa. On le retire de l'artefact publié.
      - name: Exclure le journal interne
        run: rm -rf docs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
